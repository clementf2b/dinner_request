<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>約會邀請</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card" id="card">
  <!-- Step 1: invitation -->
  <section class="step" id="s1">
    <div class="hello">你好呀</div>
    <div class="pup" aria-hidden="true">
      <!-- Silver tabby cat in a grey shark hood; mildly pleading -->
      <svg width="58" height="58" viewBox="0 0 48 48">
        <g>
          <!-- hood: dome, fin, and sides framing the face -->
          <path d="M22 9 Q23 1.5 28.5 1 Q26.5 4.5 27.5 9.5 Z" fill="#6f727a"/>
          <ellipse cx="24" cy="26.5" rx="20.5" ry="18.5" fill="#7d8088"/>
          <!-- face -->
          <ellipse cx="24" cy="30" rx="16" ry="13" fill="#b9bcc3"/>
          <path d="M19 23.5 q.8 2.4 0 4 M29 23.5 q-.8 2.4 0 4" stroke="#4a4c53" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M8.6 30 h4.4 M9.2 33.8 l4 -.8 M39.4 30 h-4.4 M38.8 33.8 l-4 -.8" stroke="#4a4c53" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M24 22.5 C22.3 25.5 21.8 28 21.6 30.5 C18.8 31.5 17.8 35 19.4 37.8 C21 41.5 27 41.5 28.6 37.8 C30.2 35 29.2 31.5 26.4 30.5 C26.2 28 25.7 25.5 24 22.5 Z" fill="#f6f6f7"/>
          <!-- hood brim with felt teeth -->
          <path d="M8 26 Q24 9 40 26" stroke="#7d8088" stroke-width="5" fill="none" stroke-linecap="round"/>
          <g fill="#f4f1ec"><path d="M11.0 21.8 l1.6 3 l1.6 -3 Z"/><path d="M15.0 18.6 l1.6 3 l1.6 -3 Z"/><path d="M19.0 17.0 l1.6 3 l1.6 -3 Z"/><path d="M23.2 16.6 l1.6 3 l1.6 -3 Z"/><path d="M27.4 17.2 l1.6 3 l1.6 -3 Z"/><path d="M31.4 19.0 l1.6 3 l1.6 -3 Z"/><path d="M35.2 22.2 l1.6 3 l1.6 -3 Z"/></g>
          <!-- eyes: big and glossy for an innocent look -->
          <ellipse cx="18.4" cy="30.2" rx="3.3" ry="3.7" fill="#2b2a30"/>
          <ellipse cx="29.6" cy="30.2" rx="3.3" ry="3.7" fill="#2b2a30"/>
          <circle cx="19.6" cy="29" r="1.3" fill="#fff"/>
          <circle cx="30.8" cy="29" r="1.3" fill="#fff"/>
          <circle cx="17.4" cy="31.6" r=".6" fill="#fff"/>
          <circle cx="28.6" cy="31.6" r=".6" fill="#fff"/>
          <ellipse cx="14.6" cy="35.4" rx="2.3" ry="1.4" fill="#ff9fb8" opacity=".6"/>
          <ellipse cx="33.4" cy="35.4" rx="2.3" ry="1.4" fill="#ff9fb8" opacity=".6"/>
          <path d="M22.8 33.6 h2.4 l-1.2 1.3 Z" fill="#cf8f86" stroke="#cf8f86" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M24 35 q-1 1.4 -2.2 .5 M24 35 q1 1.4 2.2 .5" stroke="#3b3d44" stroke-width=".9" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <h1>要不要跟我<br>去約會？</h1>
    <p class="tease" id="tease"></p>
    <div class="row" id="row1">
      <button class="btn btn-yes" id="yes" type="button">好喔 ♥</button>
      <button class="btn btn-no" id="no" type="button">不要</button>
    </div>
  </section>

  <!-- Step 2: date -->
  <section class="step" id="s2" hidden>
    <h1>什麼時候有空？</h1>
    <p class="sub">揀個好日子</p>
    <label for="date" class="sub" style="margin:0">日期</label>
    <div class="date-wrap">
      <input type="date" id="date" aria-describedby="weekday">
      <span class="weekday" id="weekday" aria-live="polite"></span>
    </div>
    <div class="slots" role="group" aria-label="時段">
      <label><input type="checkbox" name="slot" value="下午" checked>下午</label>
      <label><input type="checkbox" name="slot" value="夜晚" checked>夜晚</label>
    </div>
    <p class="tease" id="dateHint" role="alert" hidden>玩野呀！呢日過咗喇，揀今日或者之後啦</p>
    <button class="btn btn-yes btn-wide" id="toFood" type="button" disabled>就這天！♥</button>
    <button class="link restart" type="button">重新揀</button>
  </section>

  <!-- Step 3: food -->
  <section class="step" id="s3" hidden>
    <h1>想吃點什麼？</h1>
    <p class="sub">揀最多兩個你現在最想吃的</p>
    <div class="foods" id="foods" role="group" aria-label="食物選擇"></div>
    <button class="btn btn-yes btn-wide" id="toDone" type="button" disabled>就吃這個！</button>
    <button class="link restart" type="button">重新揀</button>
  </section>

  <!-- Step 4: done -->
  <section class="step" id="s4" hidden>
    <h1>約好了！😘</h1>
    <dl class="summary">
      <dt>日期</dt><dd id="outDate"></dd>
      <dt>時間</dt><dd id="outTime"></dd>
      <dt>食咩</dt><dd id="outFood"></dd>
    </dl>
    <!-- Logos: Simple Icons (CC0) -->
    <a class="btn btn-wa btn-wide" id="wa" href="#"><svg class="bi" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>用 WhatsApp 話俾佢知</a>
    <a class="btn btn-tg btn-wide" id="tg" href="#"><svg class="bi" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>用 Telegram 話俾佢知</a>
    <p class="sub" style="margin:0">如果打唔開，複製下面段字自己 send：</p>
    <div class="msg" id="msg"></div>
    <button class="btn btn-no" id="copy" type="button">複製訊息</button>
    <button class="link restart" type="button">重新揀</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
