<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>約會邀請</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card" id="card">
  <!-- Step 1: invitation -->
  <section class="step" id="s1">
    <div class="hello">你好呀</div>
    <div class="pup" aria-hidden="true">
      <svg width="58" height="58" viewBox="0 0 48 48">
        <path d="M7 24 Q6 8 10 6 Q14 5 21 12 Z" fill="#f2b872" stroke="#f2b872" stroke-width="2" stroke-linejoin="round"/>
        <path d="M41 24 Q42 8 38 6 Q34 5 27 12 Z" fill="#f2b872" stroke="#f2b872" stroke-width="2" stroke-linejoin="round"/>
        <path d="M10 18 Q10 10 12 9.5 Q14.5 9.5 17.5 13 Z" fill="#ffc9d6"/>
        <path d="M38 18 Q38 10 36 9.5 Q33.5 9.5 30.5 13 Z" fill="#ffc9d6"/>
        <ellipse cx="24" cy="28" rx="18" ry="15" fill="#f7c98f"/>
        <path d="M20 14.5 q1 3 0 5 M24 14 v5.5 M28 14.5 q-1 3 0 5" stroke="#e8a765" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse cx="16.5" cy="28" rx="3.4" ry="3.9" fill="#3a2a30"/>
        <ellipse cx="31.5" cy="28" rx="3.4" ry="3.9" fill="#3a2a30"/>
        <circle cx="17.7" cy="26.5" r="1.3" fill="#fff"/>
        <circle cx="32.7" cy="26.5" r="1.3" fill="#fff"/>
        <circle cx="15.6" cy="29.8" r=".6" fill="#fff"/>
        <circle cx="30.6" cy="29.8" r=".6" fill="#fff"/>
        <ellipse cx="11" cy="33.5" rx="3" ry="1.9" fill="#ff9fb8" opacity=".75"/>
        <ellipse cx="37" cy="33.5" rx="3" ry="1.9" fill="#ff9fb8" opacity=".75"/>
        <path d="M23 31.6 h2 l-1 1.1 Z" fill="#e0607e" stroke="#e0607e" stroke-width=".8" stroke-linejoin="round"/>
        <path d="M24 32.8 q-1.3 1.9 -2.8 .6 M24 32.8 q1.3 1.9 2.8 .6" stroke="#3a2a30" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>要不要跟我<br>去約會？</h1>
    <p class="tease" id="tease"></p>
    <div class="row" id="row1">
      <button class="btn btn-yes" id="yes" type="button">好喔 ♥</button>
      <button class="btn btn-no" id="no" type="button">不要</button>
    </div>
  </section>

  <!-- Step 2: date -->
  <section class="step" id="s2" hidden>
    <h1>什麼時候有空？</h1>
    <p class="sub">揀個好日子</p>
    <label for="date" class="sub" style="margin:0">日期</label>
    <div class="date-wrap">
      <input type="date" id="date" aria-describedby="weekday">
      <span class="weekday" id="weekday" aria-live="polite"></span>
    </div>
    <button class="btn btn-yes btn-wide" id="toFood" type="button" disabled>就這天！♥</button>
  </section>

  <!-- Step 3: food -->
  <section class="step" id="s3" hidden>
    <h1>想吃點什麼？</h1>
    <p class="sub">揀最多兩個你現在最想吃的</p>
    <div class="foods" id="foods" role="group" aria-label="食物選擇"></div>
    <button class="btn btn-yes btn-wide" id="toDone" type="button" disabled>就吃這個！</button>
  </section>

  <!-- Step 4: done -->
  <section class="step" id="s4" hidden>
    <h1>約好了！</h1>
    <dl class="summary">
      <dt>日期</dt><dd id="outDate"></dd>
      <dt>食咩</dt><dd id="outFood"></dd>
    </dl>
    <a class="btn btn-yes btn-wide" id="wa" href="#">用 WhatsApp 話俾佢知</a>
    <a class="btn btn-tg btn-wide" id="tg" href="#">用 Telegram 話俾佢知</a>
    <p class="sub" style="margin:0">如果打唔開，複製下面段字自己 send：</p>
    <div class="msg" id="msg"></div>
    <button class="btn btn-no" id="copy" type="button">複製訊息</button>
    <button class="link" id="restart" type="button">重新揀</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
